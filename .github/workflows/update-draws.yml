name: Update draws

# 매주 일요일 0시(KST)에 당첨번호를 갱신한다. 원본이 늦으면 9시(KST)에 한 번 더 시도한다.
on:
  schedule:
    - cron: "0 15 * * 6"   # 토 15:00 UTC = 일 00:00 KST
    - cron: "0 0 * * 0"    # 일 00:00 UTC = 일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch draws
        run: |
          set +e
          python update_data.py
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::원본 데이터가 아직 이번 주 회차를 반영하지 않았습니다."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit if changed
        run: |
          # draws.json 은 한 줄짜리 파일이라 git diff 로는 갱신 시각만 바뀐 경우를 걸러낼 수 없다.
          # 커밋된 파일과 새 파일의 최신 회차를 직접 비교한다.
          before=$(git show HEAD:draws.json | python -c "import json,sys;print(json.load(sys.stdin)['draws'][-1][0])")
          latest=$(python -c "import json;print(json.load(open('draws.json'))['draws'][-1][0])")
          echo "커밋된 최신 회차: ${before}, 받은 최신 회차: ${latest}"
          if [ "$latest" -le "$before" ]; then
            echo "새 회차 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          git commit -m "data: ${latest}회 당첨번호 반영"
          git push
